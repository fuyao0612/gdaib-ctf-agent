# 初审黄金案例的独立运行环境。它覆盖默认项目名、Web 端口和持久卷，绝不复用用户数据卷。
name: yuwang-golden-demo

services:
  data-init:
    volumes:
      - yuwang-golden-demo-data:/data
      - ${YUWANG_GOLDEN_BOOTSTRAP_PATH:-./data/golden-demo/bootstrap}:/legacy:ro
  api:
    volumes:
      - yuwang-golden-demo-data:/data
  web:
    ports: !override
      - "127.0.0.1:${YUWANG_GOLDEN_WEB_PORT:-18080}:8080"

volumes:
  yuwang-data: !reset null
  yuwang-golden-demo-data:
